name: Refresh dashboard data

on:
  schedule:
    - cron: "7 */4 * * *"   # every 4 hours, around the clock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull live data
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: python3 scripts/pull.py
      - name: Commit refreshed data
        run: |
          git config user.name "dashboard-agent"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: scheduled refresh"
          git push
